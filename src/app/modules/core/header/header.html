<p-menubar [model]="items" class="header-menubar">
  <ng-template #start>
    <div class="logo mr-3" [class.invert]="!themeService.isDarkMode()"></div>
    <div class="text-3xl font-semibold">FinLab</div>
  </ng-template>
  <ng-template #end>
    <div class="flex items-center align-items-center gap-2">
      <!-- <input type="text" pInputText placeholder="Search" class="mr-3 w-20rem" /> -->
      <div
        class="rounded-2xl bg-green-200 border-green-400 border px-3 flex gap-5 items-center mr-3 py-1 dark:text-black"
      >
        <div>Base Currency:</div>
        <span class="font-medium">USD</span>
      </div>
      <p-button
        [icon]="themeService.isDarkMode() ? 'pi pi-sun' : 'pi pi-moon'"
        (onClick)="toggleTheme()"
        class="mr-1"
        severity="secondary"
        [text]="true"
      />
      <div class="relative mr-4">
        <p-button
          icon="pi pi-bell"
          (onClick)="notificationMenu.toggle($event)"
          severity="secondary"
          [text]="true"
          [badge]="notificationCount > 0 ? notificationCount.toString() : undefined"
          badgeSeverity="danger"
          class="notification-button"
        />

        <p-menu
          #notificationMenu
          [model]="notificationItems"
          [popup]="true"
          appendTo="body"
          styleClass="notification-menu"
        />
      </div>
      <div class="flex items-center cursor-pointer">
        <p-avatar label="AG" class="mr-2 user-avatar" size="large" />
        <div class="flex flex-col justify-center mr-4">
          <span class="font-medium"> Aby George </span>
          <span class="text-xs text-muted-color">Super Admin</span>
        </div>
        <!-- <p-button
          icon="pi pi-chevron-down"
          [text]="true"
          severity="secondary"
          (onClick)="userMenu.toggle($event)"
          #menuButton
        />
        <p-menu #userMenu [model]="userMenuItems" [popup]="true" appendTo="body" /> -->
        <p-button
          icon="pi pi-sign-out"
          variant="outlined"
          text="true"
          severity="contrast"
          (onClick)="onLogout()"
          [title]="'Sign Out'"
        />
      </div>
    </div>
  </ng-template>
</p-menubar>
