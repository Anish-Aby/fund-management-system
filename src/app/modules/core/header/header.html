<p-menubar [model]="items" styleClass="app-menubar" class="header-menubar">
  <ng-template #start>
    <div class="flex items-center gap-3 mr-3">
      <div class="logo" [class.invert]="!themeService.isDarkMode()"></div>
      <span class="text-lg font-bold tracking-tight text-slate-900">FinLab</span>
    </div>
  </ng-template>

  <ng-template #end>
    <div class="flex items-center gap-1">
      <!-- Base currency pill -->
      <!-- <div
        class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 border border-emerald-200 mr-2"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 flex-shrink-0"></span>
        <span class="text-[11px] font-medium text-slate-500 leading-none">Base</span>
        <span class="text-[11px] font-bold text-emerald-700 leading-none font-mono">USD</span>
      </div> -->

      <!-- Theme toggle -->
      <!-- <button
        class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors"
        (click)="toggleTheme()"
        [title]="themeService.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <i class="pi text-[13px]" [ngClass]="themeService.isDarkMode() ? 'pi-sun' : 'pi-moon'"></i>
      </button> -->

      <!-- Notifications -->
      <div class="relative">
        <button
          class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors relative"
          (click)="notificationMenu.toggle($event)"
          title="Notifications"
        >
          <i class="pi pi-bell text-[13px]"></i>
          @if (notificationCount > 0) {
            <span
              class="absolute top-1 right-1 w-2 h-2 rounded-full bg-rose-500 border border-white flex-shrink-0"
            ></span>
          }
        </button>
        <p-menu
          #notificationMenu
          [model]="notificationItems"
          [popup]="true"
          appendTo="body"
          styleClass="notification-menu"
        />
      </div>

      <!-- Divider -->
      <div class="w-px h-5 bg-slate-200 mx-2"></div>

      <!-- User block -->
      <div class="flex items-center gap-2.5 pl-1 cursor-pointer group">
        <!-- Avatar -->
        <div
          class="w-7 h-7 rounded-full bg-gradient-to-br from-indigo-400 to-indigo-600 flex items-center justify-center flex-shrink-0 shadow-sm"
        >
          <span class="text-[10px] font-bold text-white leading-none">AG</span>
        </div>

        <!-- Name + role -->
        <div class="flex flex-col gap-0.5 mr-1">
          <span class="text-[12px] font-semibold text-slate-800 leading-none">Aby George</span>
          <span class="text-[10px] text-slate-400 leading-none">Super Admin</span>
        </div>

        <!-- Sign out -->
        <button
          class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-colors"
          (click)="onLogout()"
          title="Sign Out"
        >
          <i class="pi pi-sign-out text-[12px]"></i>
        </button>
      </div>
    </div>
  </ng-template>
</p-menubar>
