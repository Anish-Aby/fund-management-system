<div
  class="taskbar flex min-h-10 w-full px-5 border-surface border-t gap-2 bg-sky-100 dark:bg-gray-800 dark:border-gray-600"
>
  @for (win of dialogWindowService.minimized$ | async; track $index) {
  <div class="flex items-center">
    <div
      class="col-auto border w-30 justify-between px-1 flex h-7 items-center gap-2 border-black dark:border-gray-500 rounded-lg bg-surface-100 dark:bg-gray-700 p-1 text-center cursor-pointer dark:text-white"
      (click)="dialogWindowService.restore($index)"
      [title]="win.title"
    >
      {{ win.title.length > 8 ? win.title.substring(0, 8) + '...' : win.title }}
      <div
        class="pi pi-times text-xs!"
        (click)="$event.stopPropagation(); dialogWindowService.close($index)"
      ></div>
    </div>
  </div>
  }
</div>
