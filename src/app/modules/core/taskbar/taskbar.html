<div class="taskbar">
  <!-- Empty state hint -->
  @if ((dialogWindowService.windowsObservable$ | async)?.length === 0) {
    <span class="taskbar__empty">No open windows</span>
  }

  @for (win of dialogWindowService.windowsObservable$ | async; track win.id) {
    <div
      class="taskbar__item"
      [class.taskbar__item--active]="win.active"
      [class.taskbar__item--minimized]="win.minimized && !win.active"
      [title]="win.title"
      (click)="
        win.minimized
          ? dialogWindowService.restore(win.id)
          : dialogWindowService.focusWindow(win.id)
      "
    >
      <!-- Active indicator dot -->
      <span class="taskbar__dot"></span>

      <!-- Title -->
      <span class="taskbar__title">
        {{ win.title.length > 16 ? (win.title | slice: 0 : 16) + '…' : win.title }}
      </span>

      <!-- Close -->
      <button
        class="taskbar__close"
        (click)="$event.stopPropagation(); dialogWindowService.close(win.id)"
        tabindex="-1"
      >
        <i class="pi pi-times"></i>
      </button>
    </div>
  }
</div>
