<div class="flex h-90 w-full min-h-64 flex-col items-center justify-center p-10">
  <!-- Icon cluster -->
  <div class="relative mb-6">
    <!-- Outer glow ring -->
    <div class="absolute inset-0 rounded-full bg-indigo-100 blur-xl opacity-60"></div>
    <!-- Icon container -->
    <div
      class="relative w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-50 to-indigo-100 border border-indigo-200/80 shadow-[0_2px_8px_rgba(99,102,241,0.12)] flex items-center justify-center"
    >
      <i class="pi pi-sliders-h text-indigo-500" style="font-size: 22px"></i>
    </div>
    <!-- Small decorative dots -->
    <span
      class="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-sky-400 border-2 border-white shadow-sm"
    ></span>
    <span
      class="absolute -bottom-1 -left-1 w-2.5 h-2.5 rounded-full bg-violet-400 border-2 border-white shadow-sm"
    ></span>
  </div>

  <!-- Text -->
  <h3 class="text-[15px] font-semibold text-slate-800 tracking-tight leading-none mb-2">
    No data to display
  </h3>
  <p class="text-[12px] text-slate-400 leading-relaxed text-center max-w-[220px]">
    Apply your filters above and hit <span class="font-semibold text-slate-500">Search</span> to
    load results.
  </p>

  <!-- Hint pill -->
  <div
    class="mt-5 inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100 border border-slate-200"
  >
    <i class="pi pi-arrow-up text-slate-400" style="font-size: 9px"></i>
    <span class="text-[11px] font-medium text-slate-500">Set criteria to get started</span>
  </div>
</div>
