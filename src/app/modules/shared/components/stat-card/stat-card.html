<div [class]="getCardClasses()">
  <!-- Gradient wash -->
  <div
    class="absolute inset-0 rounded-xl opacity-100 pointer-events-none"
    [class]="getGradientClass()"
  ></div>

  <!-- Watermark icon -->
  <div class="absolute -bottom-1 -right-2 opacity-[0.06] pointer-events-none">
    <i class="pi text-[300px]" [class]="getWatermarkClass()"></i>
  </div>

  <!-- Content -->
  <div class="relative flex flex-col gap-2">
    <!-- Row 1: icon + title + badge pill -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div
          class="w-6 h-6 rounded-md flex items-center justify-center flex-shrink-0"
          [class]="getIconBgClass()"
        >
          <i class="pi text-[11px]" [class]="getIconClass()"></i>
        </div>
        <span class="text-[11px] font-medium leading-none tracking-tight" [class]="getValueClass()">
          {{ title }}
        </span>
      </div>

      @if (badge) {
        <div class="flex items-center gap-1 px-1.5 py-0.5 rounded-full" [class]="getTrendBgClass()">
          <span class="w-1 h-1 rounded-full flex-shrink-0" [class]="getDotClass()"></span>
          <span class="text-[9px] font-semibold leading-none" [class]="getTrendColor()">
            {{ badge }}
          </span>
        </div>
      }
    </div>

    <!-- Row 2: count + status icon -->
    <div class="flex items-end justify-between">
      <div class="text-[24px] font-bold tracking-tight leading-none" [class]="getValueClass()">
        {{ value }}
      </div>
      <div
        class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0"
        [class]="getIconBgClass()"
      >
        <i class="pi text-[16px]" [class]="getIconClass()"></i>
      </div>
    </div>

    <!-- Row 3: amount + last updated -->
    <div class="flex items-center justify-between pt-2 border-t" [class]="getDividerClass()">
      <span [class]="getAmountClass()" class="text-[11px] font-semibold tabular-nums leading-none">
        Total
      </span>
      <span
        class="text-[11px] font-semibold tabular-nums leading-none"
        [class]="getAmountClass()"
        >{{ subtitle }}</span
      >

      <!-- <span class="flex items-center gap-1 leading-none">
        <i class="pi pi-clock text-slate-400 dark:text-zinc-600" style="font-size: 8px"></i>
        <span class="text-[9px] text-slate-400 dark:text-zinc-600">{{ lastUpdated }}</span>
      </span> -->
    </div>
  </div>
</div>
