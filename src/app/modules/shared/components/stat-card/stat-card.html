<div [class]="getCardClasses()">
  <!-- Gradient wash -->
  <div
    class="absolute inset-0 rounded-xl opacity-30 pointer-events-none"
    [class]="getGradientClass()"
  ></div>

  <!-- Watermark icon -->
  <div class="absolute -bottom-1 -right-2 opacity-[0.06] pointer-events-none">
    <i class="pi text-[100px]" [class]="getWatermarkClass()"></i>
  </div>

  <!-- Content -->
  <div class="relative flex flex-col gap-2">
    <!-- Row 1: icon + title + live badge -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div
          class="w-6 h-6 rounded-md flex items-center justify-center flex-shrink-0"
          [class]="getIconBgClass()"
        >
          <i class="pi text-[11px]" [class]="getIconClass()"></i>
        </div>
        <span class="text-[11px] font-medium text-slate-500 leading-none tracking-tight">{{
          title
        }}</span>
      </div>
      <div class="flex items-center gap-1 px-1.5 py-0.5 rounded-full" [class]="getTrendBgClass()">
        <span class="w-1 h-1 rounded-full animate-pulse" [class]="getDotClass()"></span>
        <span class="text-[9px] font-semibold leading-none" [class]="getTrendColor()">Live</span>
      </div>
    </div>

    <!-- Row 2: big number + mini bars — same baseline -->
    <div class="flex items-end justify-between">
      <div class="text-[24px] font-bold tracking-tight leading-none" [class]="getValueClass()">
        {{ value }}
      </div>

      <!-- Arc ring showing % of total invoices -->
      <div class="relative flex-shrink-0 mb-[1px]" style="width: 36px; height: 36px">
        <svg width="36" height="36" viewBox="0 0 36 36" class="-rotate-90">
          <!-- Track -->
          <circle cx="18" cy="18" r="14" fill="none" stroke="#f1f5f9" stroke-width="3" />
          <!-- Progress arc -->
          <circle
            cx="18"
            cy="18"
            r="14"
            fill="none"
            [attr.stroke]="getAccentHex()"
            stroke-width="3"
            stroke-linecap="round"
            stroke-dasharray="87.96"
            [attr.stroke-dashoffset]="87.96 - (87.96 * percentage) / 100"
            style="transition: stroke-dashoffset 0.6s ease"
          />
        </svg>
        <!-- Center % label -->
        <div class="absolute inset-0 flex items-center justify-center rotate-0">
          <span
            style="font-size: 8px; font-weight: 800; line-height: 1; letter-spacing: -0.02em"
            [class]="getTrendColor()"
            >{{ percentage }}%</span
          >
        </div>
      </div>
    </div>

    <!-- Row 3: amount + change chip -->
    <div class="flex items-center justify-between pt-2 border-t" [class]="getDividerClass()">
      <span
        class="text-[11px] font-semibold tabular-nums leading-none"
        [class]="getAmountClass()"
        >{{ subtitle }}</span
      >
      <!-- Arrow and % forced to exact same size via inline style -->
      <div
        class="flex items-center gap-[3px] px-1.5 py-[3px] rounded-md"
        [class]="getChangeBgClass()"
      >
        <svg style="width: 8px; height: 8px; flex-shrink: 0" viewBox="0 0 10 10" fill="none">
          <path
            d="M5 8V2M5 2L2 5M5 2L8 5"
            [attr.stroke]="getAccentHex()"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span style="font-size: 9px; line-height: 9px; font-weight: 700" [class]="getTrendColor()"
          >12%</span
        >
      </div>
    </div>
  </div>
</div>
